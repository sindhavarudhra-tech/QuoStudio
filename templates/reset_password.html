<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Set New Password - QuoStudio</title>
    
    <link href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg-card: rgba(17, 24, 39, 0.85);
            --text-main: #ffffff;
            --text-muted: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.15);
            --input-bg: rgba(11, 15, 25, 0.7);
            --accent-blue: #2563EB;
        }

        body { 
            color: var(--text-main); 
            font-family: 'Geist', -apple-system, sans-serif; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow-y: auto;
            background-color: #0F172A;
            padding: 40px 20px;
        }

        h1, h2, h3, h4, h5, h6, .brand-text {
            font-family: 'Clash Grotesk', sans-serif;
        }

        .cinematic-bg {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1;
            background-image: linear-gradient(to bottom, rgba(11, 15, 25, 0.93), rgba(11, 15, 25, 0.93)), url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');
            background-size: cover; background-position: center; pointer-events: none;
        }

        .auth-card {
            background: var(--bg-card); backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            border: 1px solid var(--border-color); border-radius: 24px; padding: 40px;
            width: 100%; max-width: 440px; box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0; transform: translateY(30px);
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .brand-logo {
            width: 36px; height: 36px; 
            background: var(--text-main); 
            color: #0F172A; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 700; 
            font-size: 18px; 
            font-family: 'Clash Grotesk', sans-serif;
        }

        .form-control { background-color: var(--input-bg) !important; color: var(--text-main) !important; border: 1px solid var(--border-color); padding: 14px 16px; border-radius: 12px; margin-bottom: 8px; font-family: 'Geist', sans-serif; font-size: 15px; transition: 0.3s; }
        .form-control:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 4px rgba(37,99,235,0.25); background-color: rgba(11, 15, 25, 0.9) !important; }
        .form-control::placeholder { color: #94A3B8; opacity: 1; }

        .btn-primary-custom { background: var(--accent-blue); color: white; border: none; border-radius: 12px; font-weight: 600; padding: 14px; width: 100%; transition: 0.2s; font-size: 15px; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary-custom:hover:not(:disabled) { background: #1D4ED8; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37,99,235,0.4); }
        .btn-primary-custom:disabled { opacity: 0.6; cursor: not-allowed; }

        .spinner-border-sm { width: 1rem; height: 1rem; border-width: 0.15em; }

        .alert-box { display: none; padding: 12px; border-radius: 12px; margin-bottom: 24px; font-size: 14px; font-weight: 500; text-align: center; }
        .alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); color: #FCA5A5; }
        .alert-success { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.5); color: #6EE7B7; }

        /* Mobile Optimization */
        @media (max-width: 480px) {
            body {
                padding: 20px 16px;
                align-items: flex-start;
            }
            .auth-card {
                padding: 32px 24px;
                border-radius: 20px;
                margin-top: 10vh;
            }
            .brand-header {
                margin-bottom: 20px;
            }
            .form-control {
                font-size: 16px; 
                padding: 12px 14px;
            }
            .btn-primary-custom {
                font-size: 16px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="cinematic-bg"></div>

    <div class="auth-card shadow-lg text-center">
        <div class="brand-header">
            <div class="brand-logo">Q</div>
            <h2 class="brand-text m-0 fw-semibold text-white" style="letter-spacing: -0.02em;">QuoStudio</h2>
        </div>

        <h4 class="fw-bold mb-2 text-white" style="font-family: 'Clash Grotesk', sans-serif;">Secure Your Account</h4>
        <p class="small mb-4" style="color: var(--text-muted);">Please enter a new password for your QuoStudio account.</p>
        
        <div id="statusAlert" class="alert-box"></div>

        <form id="resetForm" class="text-start">
            <div class="mb-3">
                <label class="small fw-bold text-uppercase mb-1" style="color: #94A3B8; letter-spacing: 0.05em;">New Password</label>
                <div class="position-relative">
                    <input type="password" id="resetPasswordInput" class="form-control" required minlength="6" style="padding-right: 45px;" placeholder="At least 6 characters">
                    <button type="button" class="btn border-0 position-absolute" style="right: 8px; top: 50%; transform: translateY(-50%); color: #94A3B8; padding: 4px; background: transparent; z-index: 5;" onclick="toggleResetPassword()">
                        <i data-lucide="eye" id="resetEyeIcon" style="width: 20px; height: 20px;"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary-custom" id="submitBtn">Update Password</button>
        </form>
    </div>

    <script>
        lucide.createIcons();
        const _supabase = supabase.createClient('{{ supabase_url }}', '{{ supabase_key }}');

        function toggleResetPassword() {
            const pwdInput = document.getElementById('resetPasswordInput');
            const eyeIcon = document.getElementById('resetEyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                pwdInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        function showAlert(msg, isError) {
            const box = document.getElementById('statusAlert');
            box.style.display = 'block';
            box.innerText = msg;
            box.className = isError ? 'alert-box alert-error' : 'alert-box alert-success';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('resetPasswordInput').value;
            const btn = document.getElementById('submitBtn');
            
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Updating password...`;

            const { data, error } = await _supabase.auth.updateUser({
                password: newPassword
            });

            if (error) {
                showAlert(error.message, true);
                btn.disabled = false;
                btn.innerHTML = 'Update Password';
                return;
            }

            const sessionData = await _supabase.auth.getSession();
            const userEmail = sessionData.data.session?.user?.email;

            if (userEmail) {
                await fetch('/update-password-backend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, password: newPassword })
                });
            }

            showAlert('Password updated successfully! Redirecting to sign in...', false);
            btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Redirecting...`;
            
            setTimeout(() => {
                window.location.href = '/auth';
            }, 2000);
        });
    </script>
</body>
</html>
