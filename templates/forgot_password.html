<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - QuoStudio</title>
    
    <link href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg-card: rgba(17, 24, 39, 0.85);
            --text-main: #ffffff;
            --text-muted: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.15);
            --input-bg: rgba(11, 15, 25, 0.7);
            --accent-blue: #2563EB;
        }

        body { 
            color: var(--text-main); 
            font-family: 'Geist', -apple-system, sans-serif; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            background-color: #0F172A;
        }

        .cinematic-bg {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1;
            background-image: linear-gradient(to bottom, rgba(11, 15, 25, 0.93), rgba(11, 15, 25, 0.93)), url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');
            background-size: cover; background-position: center; pointer-events: none;
        }

        .auth-card {
            background: var(--bg-card); backdrop-filter: blur(24px) saturate(150%);
            border: 1px solid var(--border-color); border-radius: 24px; padding: 40px;
            width: 100%; max-width: 440px; box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        .form-control { background-color: var(--input-bg) !important; color: var(--text-main) !important; border: 1px solid var(--border-color); padding: 14px 16px; border-radius: 12px; margin-bottom: 20px; font-family: 'Geist', sans-serif; font-size: 15px; transition: 0.3s; }
        .form-control:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 4px rgba(37,99,235,0.25); background-color: rgba(11, 15, 25, 0.9) !important; }
        .form-control::placeholder { color: #94A3B8; opacity: 1; }

        .btn-primary { background-color: var(--accent-blue); border: none; font-weight: 600; padding: 14px; border-radius: 12px; width: 100%; transition: 0.3s; margin-bottom: 16px; color: #ffffff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37,99,235,0.4); background-color: #1D4ED8; }

        .alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); color: #FCA5A5; padding: 12px; border-radius: 12px; margin-bottom: 24px; font-size: 14px; font-weight: 500; text-align: center; }
        .alert-success { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.5); color: #6EE7B7; padding: 12px; border-radius: 12px; margin-bottom: 24px; font-size: 14px; font-weight: 500; text-align: center; }
    </style>
</head>
<body>

    <div class="cinematic-bg"></div>

    <div class="auth-card text-center">
        <h3 class="fw-bold mb-2 text-white" style="font-family: 'Clash Grotesk', sans-serif;">Reset Password</h3>
        <p class="small mb-4" style="color: var(--text-muted);">Enter your email address and we'll send you a link to reset your password.</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
                <div class="alert-{{ 'error' if category == 'error' else 'success' }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/forgot-password" method="POST" class="text-start">
            <input type="email" name="email" class="form-control" placeholder="Email address" required>
            <button type="submit" class="btn btn-primary">Send Reset Link</button>
        </form>

        <a href="/auth" style="font-size: 14px; color: var(--text-muted); text-decoration: none; transition: 0.2s;" onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color='var(--text-muted)'">
            <i data-lucide="arrow-left" style="width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px;"></i> Back to Sign In
        </a>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
