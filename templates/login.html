<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authentication - QuoStudio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #0F172A; color: white; font-family: -apple-system, sans-serif; 
            display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; 
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 48px 48px;
        }
        .login-box { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .form-control { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 14px; border-radius: 8px; margin-bottom: 16px; font-size: 15px; }
        .form-control::placeholder { color: #64748B; }
        .form-control:focus { background: rgba(0,0,0,0.3); border-color: #2563EB; color: white; box-shadow: 0 0 0 3px rgba(37,99,235,0.2); }
        .btn-primary { background: #2563EB; border: none; padding: 14px; border-radius: 8px; font-weight: 600; width: 100%; margin-top: 10px; font-size: 15px; transition: 0.2s; }
        .btn-primary:hover { background: #1D4ED8; transform: translateY(-2px); }
        .toggle-link { color: #2563EB; cursor: pointer; text-decoration: underline; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="d-flex align-items-center justify-content-center gap-3 mb-4">
            <div style="width: 32px; height: 32px; background: white; color: #0F172A; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold;">Q</div>
            <h3 class="m-0 fw-bold">QuoStudio</h3>
        </div>
        
        <p class="text-center mb-4 text-muted" id="formSubtitle">Sign in to your workspace</p>
        
        <form method="POST" action="/auth">
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="text-danger small mb-3 text-center p-2 rounded" style="background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444;">{{ messages[0] }}</div>
              {% endif %}
            {% endwith %}

            <input type="hidden" name="action" id="actionField" value="login">
            
            <div id="signupFields" style="display: none;">
                <input type="text" name="username" class="form-control" placeholder="Unique Username (@yourname)">
                <input type="text" name="company_name" class="form-control" placeholder="Company / Freelance Name">
            </div>
            
            <input type="email" name="email" class="form-control" placeholder="Email address" required>
            <input type="password" name="password" class="form-control" placeholder="Password" required>
            
            <button type="submit" class="btn btn-primary" id="submitBtn">Sign In</button>
        </form>
        
        <div class="text-center mt-4">
            <span class="text-muted small" id="toggleText">New to QuoStudio? </span>
            <span class="toggle-link" onclick="toggleForm()">Create an account</span>
        </div>
    </div>

    <script>
        let isLogin = true;
        function toggleForm() {
            isLogin = !isLogin;
            document.getElementById('actionField').value = isLogin ? 'login' : 'signup';
            document.getElementById('signupFields').style.display = isLogin ? 'none' : 'block';
            document.getElementById('submitBtn').innerText = isLogin ? 'Sign In' : 'Create Account';
            document.getElementById('formSubtitle').innerText = isLogin ? 'Sign in to your workspace' : 'Set up your profile';
            document.getElementById('toggleText').innerText = isLogin ? 'New to QuoStudio? ' : 'Already have an account? ';
            document.querySelector('.toggle-link').innerText = isLogin ? 'Create an account' : 'Sign in';
            
            if(!isLogin) {
                document.querySelectorAll('#signupFields input').forEach(inp => inp.required = true);
            } else {
                document.querySelectorAll('#signupFields input').forEach(inp => inp.required = false);
            }
        }
    </script>
</body>
</html>
