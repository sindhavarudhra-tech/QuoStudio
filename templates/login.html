<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Authentication - QuoStudio</title>
    
    <!-- Premium Fonts: Clash Grotesk (Headings) & Geist (Body) -->
    <link href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg-nav: rgba(11, 15, 25, 0.4);
            --bg-card: rgba(17, 24, 39, 0.7);
            --bg-tab-container: rgba(11, 15, 25, 0.5);
            --text-main: #ffffff;
            --text-muted: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(11, 15, 25, 0.5);
            --accent-blue: #2563EB;
        }

        body { 
            color: var(--text-main); 
            font-family: 'Geist', -apple-system, sans-serif; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow-y: auto;
            background-color: #0F172A;
            padding: 40px 20px;
        }

        h1, h2, h3, h4, h5, h6, .brand-text {
            font-family: 'Clash Grotesk', sans-serif;
        }

        .cinematic-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background-image: 
                linear-gradient(to bottom, rgba(11, 15, 25, 0.93), rgba(11, 15, 25, 0.93)),
                url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .brand-logo {
            width: 36px; height: 36px; 
            background: var(--text-main); 
            color: #0F172A; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 700; 
            font-size: 18px; 
            font-family: 'Clash Grotesk', sans-serif;
        }

        /* Playful Sliding Tabs Container */
        .auth-tabs {
            position: relative;
            display: flex;
            background: var(--bg-tab-container);
            border-radius: 14px;
            padding: 6px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        .auth-tabs-slider {
            position: absolute;
            top: 6px;
            bottom: 6px;
            left: 6px;
            width: calc(50% - 6px);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .auth-tabs.signup-active .auth-tabs-slider {
            transform: translateX(100%);
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            z-index: 2;
            transition: color 0.3s ease;
            font-family: 'Geist', sans-serif;
            text-align: center;
        }

        .auth-tab.active {
            color: var(--text-main);
        }

        .auth-tab:hover:not(.active) {
            color: #E2E8F0;
        }

        .smooth-collapse {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            transition: grid-template-rows 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .smooth-collapse.expanded {
            grid-template-rows: 1fr;
            opacity: 1;
        }
        .smooth-collapse > div {
            overflow: hidden;
        }

        .forgot-password-collapse {
            display: grid;
            grid-template-rows: 1fr;
            opacity: 1;
            transition: grid-template-rows 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .forgot-password-collapse.collapsed {
            grid-template-rows: 0fr;
            opacity: 0;
        }
        .forgot-password-collapse > div {
            overflow: hidden;
        }

        .form-control {
            background-color: var(--input-bg) !important;
            color: var(--text-main) !important;
            border: 1px solid var(--border-color);
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
            font-family: 'Geist', sans-serif;
            font-size: 15px;
        }
        
        .form-control:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(37,99,235,0.15);
            background-color: rgba(11, 15, 25, 0.7) !important;
        }

        .form-control::placeholder { color: #64748B; }

        .btn-primary {
            background-color: var(--accent-blue);
            border: none;
            font-weight: 600;
            padding: 14px;
            border-radius: 12px;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: 'Geist', sans-serif;
            font-size: 15px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37,99,235,0.3);
            background-color: #1D4ED8;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .alert-error {
            background: rgba(239, 68, 68, 0.15); 
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #FCA5A5;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }
        
        .alert-success {
            background: rgba(16, 185, 129, 0.15); 
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #6EE7B7;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }

        .glowing-link {
            color: #60A5FA;
            font-weight: 600;
            text-decoration: underline;
            text-shadow: 0 0 10px rgba(37, 99, 235, 0.6), 0 0 20px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
        }
        .glowing-link:hover {
            color: #93C5FD;
            text-shadow: 0 0 15px rgba(37, 99, 235, 0.9), 0 0 30px rgba(59, 130, 246, 0.7);
        }

        .username-suggestion-pill {
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid rgba(37, 99, 235, 0.3);
            color: #93C5FD;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .username-suggestion-pill:hover {
            background: rgba(37, 99, 235, 0.35);
            color: white;
        }

        .modal-content {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 20px;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 16px;
                align-items: flex-start;
            }
            .login-card {
                padding: 32px 24px;
                border-radius: 20px;
                margin-top: 5vh;
            }
            .brand-header {
                margin-bottom: 24px;
            }
            .auth-tab {
                font-size: 13px;
                padding: 8px;
            }
            .form-control {
                font-size: 16px; 
                padding: 12px 14px;
                margin-bottom: 12px;
            }
            .btn-primary {
                font-size: 16px;
                padding: 12px;
                margin-top: 4px;
            }
        }
    </style>
</head>
<body>

    <div class="cinematic-bg"></div>

    <div class="login-card">
        <div class="brand-header">
            <div class="brand-logo">Q</div>
            <h2 class="brand-text m-0 fw-semibold text-white" style="letter-spacing: -0.02em;">QuoStudio</h2>
        </div>
        
        <div class="auth-tabs" id="authTabsContainer">
            <div class="auth-tabs-slider"></div>
            <button type="button" class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
            <button type="button" class="auth-tab" id="tabSignup" onclick="switchTab('signup')">Create Account</button>
        </div>

        <form method="POST" action="/auth" id="authForm" onsubmit="return handleFormSubmit(event)">
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                    <div class="alert-{{ 'error' if category == 'error' else 'success' }}">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <div id="clientErrorAlert" class="alert-error" style="display: none;"></div>

            <input type="hidden" name="action" id="actionField" value="login">
            
            <div id="signupFields" class="smooth-collapse">
                <div>
                    <div style="padding-bottom: 16px;">
                        <div class="mb-3 position-relative">
                            <input type="text" name="username" id="usernameInput" class="form-control mb-1" placeholder="Username (@yourname)">
                            <div id="usernameFeedback" style="font-size: 13px; font-weight: 500; margin-left: 2px; display: none;"></div>
                            <div id="usernameSuggestions" class="align-items-center flex-wrap gap-2 mt-2" style="display: none;"></div>
                        </div>
                        <input type="text" name="company_name" class="form-control mb-0" placeholder="Company / Freelance Name">
                    </div>
                </div>
            </div>
            
            <input type="email" name="email" class="form-control" placeholder="Email address" required>
            
            <div class="position-relative mb-1">
                <input type="password" name="password" id="passwordInput" class="form-control mb-0" placeholder="Password" required style="padding-right: 45px;">
                <button type="button" id="eyeBtn" class="btn border-0 position-absolute" style="right: 8px; top: 50%; transform: translateY(-50%); color: var(--text-muted); padding: 4px; background: transparent; z-index: 5;" onclick="togglePassword()">
                    <i data-lucide="eye" id="eyeIcon" style="width: 20px; height: 20px;"></i>
                </button>
            </div>
            
            <!-- Terms & Privacy Checkboxes -->
            <div id="signupTermsContainer" class="smooth-collapse">
                <div>
                    <div style="padding-top: 16px; padding-bottom: 8px; font-size: 13px; color: var(--text-muted);">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="termsCheck" style="accent-color: var(--accent-blue); cursor: pointer;">
                            <label class="form-check-label" for="termsCheck" style="cursor: pointer;">
                                I agree to the <a href="#" onclick="openModal(event, 'terms')" class="glowing-link">Terms of Service</a>
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="privacyCheck" style="accent-color: var(--accent-blue); cursor: pointer;">
                            <label class="form-check-label" for="privacyCheck" style="cursor: pointer;">
                                I agree to the <a href="#" onclick="openModal(event, 'privacy')" class="glowing-link">Privacy Policy</a>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Forgot Password Link -->
            <div id="forgotPasswordWrapper" class="forgot-password-collapse text-end">
                <div>
                    <div style="padding-top: 8px; padding-bottom: 16px;">
                        <a href="/forgot-password" style="font-size: 13px; color: var(--text-muted); text-decoration: none; transition: 0.2s;" onmouseover="this.style.color='var(--accent-blue)'" onmouseout="this.style.color='var(--text-muted)'">Forgot password?</a>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" id="submitBtn">Sign In</button>
        </form>

        <!-- Back to Website Link -->
        <div class="text-center mt-4">
            <a href="/" style="font-size: 14px; color: var(--text-muted); text-decoration: none; transition: 0.2s;" onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color='var(--text-muted)'">
                <i data-lucide="arrow-left" style="width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px;"></i> Back to website
            </a>
        </div>
    </div>

    <!-- Info Modal for Terms / Privacy -->
    <div class="modal fade" id="infoModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content p-3 p-md-4">
                <div class="modal-header border-0 pb-0">
                    <h4 class="modal-title fw-bold brand-text" id="modalTitle" style="color: var(--text-main);"></h4>
                    <button type="button" class="btn-close" style="filter: invert(1);" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body py-3" id="modalBody" style="color: var(--text-muted); line-height: 1.7; max-height: 50vh; overflow-y: auto;">
                </div>
                <div class="modal-footer border-0 pt-3">
                    <button type="button" class="btn btn-primary py-2 rounded-pill w-100 fw-semibold" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        lucide.createIcons();
        let isUsernameAvailable = true;

        function togglePassword() {
            const pwdInput = document.getElementById('passwordInput');
            const eyeIcon = document.getElementById('eyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                pwdInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        function switchTab(mode) {
            const isLogin = (mode === 'login');
            
            document.getElementById('actionField').value = isLogin ? 'login' : 'signup';
            
            const tabsContainer = document.getElementById('authTabsContainer');
            const signupFields = document.getElementById('signupFields');
            const signupTerms = document.getElementById('signupTermsContainer');
            const forgotPwd = document.getElementById('forgotPasswordWrapper');
            const submitBtn = document.getElementById('submitBtn');

            if (isLogin) {
                tabsContainer.classList.remove('signup-active');
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('tabSignup').classList.remove('active');
                
                signupFields.classList.remove('expanded');
                signupTerms.classList.remove('expanded');
                forgotPwd.classList.remove('collapsed');
                document.getElementById('eyeBtn').style.display = 'block';
                
                document.querySelectorAll('#signupFields input').forEach(inp => inp.required = false);
                submitBtn.disabled = false;
            } else {
                tabsContainer.classList.add('signup-active');
                document.getElementById('tabSignup').classList.add('active');
                document.getElementById('tabLogin').classList.remove('active');
                
                signupFields.classList.add('expanded');
                signupTerms.classList.add('expanded');
                forgotPwd.classList.add('collapsed');
                document.getElementById('eyeBtn').style.display = 'none';
                
                document.getElementById('passwordInput').type = 'password';
                document.getElementById('eyeIcon').setAttribute('data-lucide', 'eye');
                lucide.createIcons();
                
                document.querySelectorAll('#signupFields input').forEach(inp => inp.required = true);
                submitBtn.disabled = !isUsernameAvailable;
            }
            
            submitBtn.style.opacity = '0';
            setTimeout(() => {
                submitBtn.innerText = isLogin ? 'Sign In' : 'Create Account';
                submitBtn.style.opacity = '1';
            }, 150);

            document.getElementById('clientErrorAlert').style.display = 'none';
        }

        function handleFormSubmit(e) {
            const action = document.getElementById('actionField').value;
            const isLogin = (action === 'login');
            
            if (!isLogin) {
                if (!isUsernameAvailable) {
                    e.preventDefault();
                    return false;
                }
                const termsChecked = document.getElementById('termsCheck').checked;
                const privacyChecked = document.getElementById('privacyCheck').checked;
                const errorAlert = document.getElementById('clientErrorAlert');

                if (!termsChecked || !privacyChecked) {
                    e.preventDefault();
                    let missing = [];
                    if (!termsChecked) missing.push('Terms of Service');
                    if (!privacyChecked) missing.push('Privacy Policy');

                    errorAlert.innerText = `Please agree to the ${missing.join(' and the ')} before creating your account.`;
                    errorAlert.style.display = 'block';
                    return false;
                } else {
                    errorAlert.style.display = 'none';
                }
            }

            // Disable submit button & show loading state with spinner for BOTH Sign In and Create Account
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            const btnText = isLogin ? 'Signing in...' : 'Creating account...';
            submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> ${btnText}`;
            
            return true;
        }

        function openModal(e, type) {
            e.preventDefault();
            const titleEl = document.getElementById('modalTitle');
            const bodyEl = document.getElementById('modalBody');

            if (type === 'terms') {
                titleEl.innerText = 'Terms of Service';
                bodyEl.innerHTML = `
                    <p><strong>Effective Date:</strong> October 17, 2026</p>
                    <p>Welcome to QuoStudio. By registering an account and using our platform, you agree to comply with and be bound by the following terms and conditions:</p>
                    <p><strong>1. Acceptance of Terms:</strong> By accessing or using QuoStudio, you agree to be bound by these Terms of Service and our Privacy Policy. If you do not agree to all terms, you may not use our services.</p>
                    <p><strong>2. Account Security & Responsibilities:</strong> You are responsible for maintaining the confidentiality of your account credentials, password, and for all activities that occur under your account.</p>
                    <p><strong>3. Acceptable Use Policy:</strong> You agree not to misuse the platform, distribute malicious code, spam, infringe upon intellectual property rights, or conduct unlawful activities using QuoStudio.</p>
                    <p><strong>4. Intellectual Property:</strong> All software, branding, design assets, and user interfaces provided by QuoStudio are the exclusive property of QuoStudio and protected by copyright and intellectual property laws.</p>
                    <p><strong>5. Limitation of Liability:</strong> QuoStudio is provided on an "as-is" and "as-available" basis. We are not liable for any indirect, incidental, or consequential damages arising from your use of the platform.</p>
                    <p><strong>6. Termination:</strong> We reserve the right to suspend or terminate accounts that violate these terms or engage in harmful behavior.</p>
                `;
            } else {
                titleEl.innerText = 'Privacy Policy';
                bodyEl.innerHTML = `
                    <p><strong>Effective Date:</strong> October 17, 2026</p>
                    <p>At QuoStudio, we take your privacy and data security seriously. This Privacy Policy explains how we handle your information:</p>
                    <p><strong>1. Information We Collect:</strong> We collect account registration details (such as your username, email address, and company name) necessary to provide our quotation and invoicing services.</p>
                    <p><strong>2. Client-Side End-to-End Encryption:</strong> All your inventory catalogs, pricing matrices, and business records are encrypted locally in your browser using secure cryptographic standards before interacting with storage.</p>
                    <p><strong>3. Zero-Knowledge Architecture:</strong> QuoStudio administrators and third parties cannot read, view, or access your raw encrypted catalog and quotation data. Only you control the encryption keys.</p>
                    <p><strong>4. Data Usage:</strong> Your information is used strictly to authenticate your account, maintain your workspace, and deliver core application features. We never sell your personal or business data.</p>
                    <p><strong>5. Data Portability & Deletion:</strong> You retain complete ownership of your data and can permanently delete any uploaded database catalog or quotation history from the database at any time.</p>
                    <p><strong>6. Contact Us:</strong> If you have questions regarding this Privacy Policy, please reach out through our official support channels.</p>
                `;
            }

            const infoModal = new bootstrap.Modal(document.getElementById('infoModal'));
            infoModal.show();
        }

        // Real-time Username Validation & Suggestion Generator
        const usernameInput = document.getElementById('usernameInput');
        const usernameFeedback = document.getElementById('usernameFeedback');
        const usernameSuggestions = document.getElementById('usernameSuggestions');
        const submitBtn = document.getElementById('submitBtn');
        let typingTimer;

        usernameInput.addEventListener('input', function() {
            clearTimeout(typingTimer);
            const val = this.value.trim();
            
            if(val.length < 3) {
                usernameFeedback.style.display = 'block';
                usernameFeedback.style.color = '#E2E8F0';
                usernameFeedback.innerText = 'At least 3 characters required.';
                usernameSuggestions.style.display = 'none';
                isUsernameAvailable = false;
                if (document.getElementById('actionField').value === 'signup') submitBtn.disabled = true;
                return;
            }

            usernameFeedback.style.display = 'block';
            usernameFeedback.style.color = '#94A3B8';
            usernameFeedback.innerText = 'Checking availability...';
            usernameSuggestions.style.display = 'none';

            typingTimer = setTimeout(() => {
                fetch('/check_username?username=' + encodeURIComponent(val))
                    .then(response => response.json())
                    .then(data => {
                        if(data.available) {
                            usernameFeedback.style.color = '#10B981';
                            usernameFeedback.innerHTML = '<i data-lucide="check-circle" style="width: 14px; height: 14px; margin-right: 4px; vertical-align: -2px;"></i>Available';
                            usernameSuggestions.style.display = 'none';
                            isUsernameAvailable = true;
                            if (document.getElementById('actionField').value === 'signup') submitBtn.disabled = false;
                        } else {
                            usernameFeedback.style.color = '#EF4444';
                            usernameFeedback.innerHTML = '<i data-lucide="x-circle" style="width: 14px; height: 14px; margin-right: 4px; vertical-align: -2px;"></i>Username taken';
                            
                            const randNum = Math.floor(10 + Math.random() * 90);
                            const suggestions = [
                                `${val}_official`,
                                `${val}${randNum}`,
                                `the_${val}`
                            ];

                            usernameSuggestions.innerHTML = '<span class="text-white fw-semibold me-1" style="font-size: 12px;">Suggestions:</span>' + 
                                suggestions.map(s => `<span class="username-suggestion-pill" onclick="selectSuggestion('${s}')">@${s}</span>`).join('');
                            usernameSuggestions.style.display = 'flex';
                            isUsernameAvailable = false;
                            if (document.getElementById('actionField').value === 'signup') submitBtn.disabled = true;
                        }
                        lucide.createIcons();
                    })
                    .catch(err => {
                        usernameFeedback.style.display = 'none';
                    });
            }, 500);
        });

        function selectSuggestion(sug) {
            usernameInput.value = sug;
            usernameInput.dispatchEvent(new Event('input'));
        }
    </script>
</body>
</html>
