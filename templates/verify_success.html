<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Email Verified - QuoStudio</title>
    
    <link href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg-card: rgba(17, 24, 39, 0.85);
            --text-main: #ffffff;
            --text-muted: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.15);
        }

        body { 
            background-color: #0F172A; 
            color: var(--text-main); 
            font-family: 'Geist', -apple-system, sans-serif; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0; 
            padding: 40px 20px;
            overflow-y: auto;
        }

        h1, h2, h3, h4, h5, h6, .brand-text {
            font-family: 'Clash Grotesk', sans-serif;
        }

        .cinematic-bg {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1;
            background-image: linear-gradient(to bottom, rgba(11, 15, 25, 0.93), rgba(11, 15, 25, 0.93)), url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');
            background-size: cover; background-position: center; pointer-events: none;
        }

        .auth-card { 
            background: var(--bg-card); 
            backdrop-filter: blur(24px) saturate(150%); 
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            border: 1px solid var(--border-color); 
            border-radius: 24px; 
            padding: 40px; 
            width: 100%; 
            max-width: 440px; 
            text-align: center; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0; transform: translateY(30px);
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .brand-logo {
            width: 36px; height: 36px; 
            background: var(--text-main); 
            color: #0F172A; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 700; 
            font-size: 18px; 
            font-family: 'Clash Grotesk', sans-serif;
        }

        /* Mobile Optimization */
        @media (max-width: 480px) {
            body {
                padding: 20px 16px;
                align-items: flex-start;
            }
            .auth-card {
                padding: 32px 24px;
                border-radius: 20px;
                margin-top: 10vh;
            }
            .brand-header {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="cinematic-bg"></div>

    <div class="auth-card">
        <div class="brand-header">
            <div class="brand-logo">Q</div>
            <h2 class="brand-text m-0 fw-semibold text-white" style="letter-spacing: -0.02em;">QuoStudio</h2>
        </div>

        <div style="width: 50px; height: 50px; background: rgba(16,185,129,0.2); color: #10B981; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto;">
            <i data-lucide="check" style="width: 24px; height: 24px;"></i>
        </div>
        <h3 class="fw-bold mb-2 text-white" style="font-family: 'Clash Grotesk', sans-serif;">Email Verified!</h3>
        <p class="small mb-0" style="color: #94A3B8;" id="statusText">Logging you into your dashboard...</p>
    </div>

    <script>
        lucide.createIcons();
        const _supabase = supabase.createClient('{{ supabase_url }}', '{{ supabase_key }}');

        async function verifyAndRedirect() {
            const statusText = document.getElementById('statusText');
            const { data, error } = await _supabase.auth.getSession();

            if (error || !data.session) {
                statusText.innerText = 'Verification link is invalid or has expired. Redirecting to sign in...';
                setTimeout(() => window.location.href = '/auth', 3000);
                return;
            }

            const accessToken = data.session.access_token;
            const response = await fetch('/set_flask_session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ access_token: accessToken })
            });

            if (response.ok) {
                statusText.innerText = 'Success! Redirecting to your dashboard...';
                setTimeout(() => window.location.href = '/dashboard', 1200);
            } else {
                statusText.innerText = 'Authentication error. Redirecting to sign in...';
                setTimeout(() => window.location.href = '/auth', 3000);
            }
        }

        verifyAndRedirect();
    </script>
</body>
</html>
