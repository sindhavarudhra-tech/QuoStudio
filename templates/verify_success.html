<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified - QuoStudio</title>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #0F172A; color: #ffffff; font-family: 'Geist', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .auth-card { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.15); border-radius: 24px; padding: 40px; width: 100%; max-width: 440px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
    </style>
</head>
<body>
    <div class="auth-card">
        <div style="width: 50px; height: 50px; background: rgba(16,185,129,0.2); color: #10B981; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto;">
            <i data-lucide="check" style="width: 24px; height: 24px;"></i>
        </div>
        <h3 class="fw-bold mb-2 text-white" style="font-family: 'Clash Grotesk', sans-serif;">Email Verified!</h3>
        <p class="small mb-0" style="color: #94A3B8;" id="statusText">Logging you into your dashboard...</p>
    </div>

    <script>
        lucide.createIcons();
        const _supabase = supabase.createClient('{{ supabase_url }}', '{{ supabase_key }}');

        async function verifyAndRedirect() {
            const statusText = document.getElementById('statusText');
            const { data, error } = await _supabase.auth.getSession();

            if (error || !data.session) {
                statusText.innerText = 'Verification link is invalid or has expired. Redirecting to sign in...';
                setTimeout(() => window.location.href = '/auth', 3000);
                return;
            }

            const accessToken = data.session.access_token;
            const response = await fetch('/set_flask_session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ access_token: accessToken })
            });

            if (response.ok) {
                statusText.innerText = 'Success! Redirecting to your dashboard...';
                setTimeout(() => window.location.href = '/dashboard', 1200);
            } else {
                statusText.innerText = 'Authentication error. Redirecting to sign in...';
                setTimeout(() => window.location.href = '/auth', 3000);
            }
        }

        verifyAndRedirect();
    </script>
</body>
</html>
